name: Coverage

on:
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ~/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y --no-install-recommends valac build-essential meson libglib2.0-dev ninja-build lcov ccache

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        key: coverage-ccache-${{ runner.os }}-${{ hashFiles('meson.build', 'src/**/*.vala', 'tests/**/*.vala') }}
        restore-keys: |
          coverage-ccache-${{ runner.os }}-

    - name: Configure build (coverage enabled)
      run: |
        CC="ccache gcc" meson setup build -Db_coverage=true -Denable_valadoc=false

    - name: Build
      run: |
        ccache --zero-stats || true
        ninja -C build

    - name: Unit Test
      run: meson test -C build --print-errorlogs --num-processes "$(nproc)" --no-rebuild

    - name: Check coverage (80% threshold)
      run: ./scripts/coverage.sh --check --skip-test

    - name: Show ccache stats
      if: always()
      run: ccache --show-stats || true
